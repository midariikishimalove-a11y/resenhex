<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixar vídeo</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --borda: #2a2f3a;
    --texto: #eef0f4;
    --suave: #9aa3b2;
    --destaque: #4f8cff;
    --erro: #ff6b6b;
    --ok: #4cd08a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: 16px;
    padding: 28px 24px;
  }
  h1 { margin: 0 0 6px; font-size: 1.5rem; }
  p.sub { margin: 0 0 22px; color: var(--suave); font-size: .95rem; }
  .linha { display: flex; gap: 8px; }
  input[type="url"] {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--borda);
    background: var(--bg);
    color: var(--texto);
    font-size: 1rem;
  }
  input[type="url"]:focus { outline: 2px solid var(--destaque); border-color: transparent; }
  button {
    padding: 14px 20px;
    border: 0;
    border-radius: 10px;
    background: var(--destaque);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .colar {
    background: transparent;
    border: 1px solid var(--borda);
    color: var(--suave);
    padding: 14px 14px;
  }
  #status { margin-top: 16px; min-height: 1.4em; font-size: .95rem; }
  #status.erro { color: var(--erro); }
  #status.ok { color: var(--ok); }
  #status.carregando { color: var(--suave); }
  .aviso { margin-top: 22px; font-size: .8rem; color: var(--suave); line-height: 1.5; }
  @media (max-width: 480px) {
    .linha { flex-direction: column; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Baixar vídeo do TikTok e Instagram</h1>
    <p class="sub">Cole o link, clique em baixar e o vídeo vem em HD, sem marca d'água.</p>

    <form id="form" class="linha">
      <input id="url" type="url" placeholder="https://www.tiktok.com/@usuario/video/..." required autocomplete="off">
      <button type="button" class="colar" id="colar" title="Colar da área de transferência">Colar</button>
      <button type="submit" id="baixar">Baixar</button>
    </form>

    <div id="status" role="status"></div>

    <p class="aviso">
      Funciona com posts públicos de TikTok, Reels e vídeos do Instagram.
      Use apenas para conteúdo seu ou com permissão de quem criou, e respeite os direitos autorais.
    </p>
  </main>

<script>
  const form = document.getElementById("form");
  const campo = document.getElementById("url");
  const botao = document.getElementById("baixar");
  const status = document.getElementById("status");

  function mostrar(msg, tipo) {
    status.textContent = msg;
    status.className = tipo || "";
  }

  document.getElementById("colar").addEventListener("click", async () => {
    try {
      campo.value = (await navigator.clipboard.readText()).trim();
      campo.focus();
    } catch (e) {
      mostrar("Não consegui acessar a área de transferência. Cole manualmente no campo.", "erro");
    }
  });

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    botao.disabled = true;
    mostrar("Baixando, pode levar alguns segundos...", "carregando");

    try {
      const resp = await fetch("/api/baixar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: campo.value.trim() })
      });

      if (!resp.ok) {
        let msg = "Não foi possível baixar o vídeo.";
        try { msg = (await resp.json()).erro || msg; } catch (_) {}
        mostrar(msg, "erro");
        return;
      }

      const disp = resp.headers.get("Content-Disposition") || "";
      const m = disp.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
      const nome = m ? decodeURIComponent(m[1]) : "video.mp4";

      const blob = await resp.blob();
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = nome;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);

      mostrar("Pronto! O download começou.", "ok");
    } catch (e) {
      mostrar("Erro de conexão com o servidor.", "erro");
    } finally {
      botao.disabled = false;
    }
  });
</script>
</body>
</html>
